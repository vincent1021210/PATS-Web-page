<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="PATS — 安全、高效、專注的企業級商務通訊平台。">
  <meta name="theme-color" content="#2563eb">
  <title>PATS · 商務通訊</title>

  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%232563eb'/><text x='16' y='22' font-size='16' font-family='sans-serif' font-weight='700' fill='white' text-anchor='middle'>P</text></svg>">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="assets/css/styles.css">
</head>

<body>
  <!-- 開場載入 ------------------------------------------------------- -->
  <div id="loading" class="loading-veil">
    <div class="spinner" role="status" aria-label="載入中"></div>
  </div>

  <!-- 登入頁 --------------------------------------------------------- -->
  <section id="auth" class="auth hidden">
    <aside class="auth-brand">
      <div class="auth-logo">
        <div class="avatar" aria-hidden="true">P</div>
        <div>
          <h1>PATS</h1>
          <span>Messenger</span>
        </div>
      </div>

      <div class="auth-pitch">
        <h2>企業級通訊解決方案</h2>
        <p>安全、高效、專注的商務溝通平台。提升團隊協作效率，保護企業資訊安全。</p>
      </div>

      <div class="auth-note">
        <span class="material-symbols-outlined">shield</span>
        <span>端對端加密技術保護</span>
      </div>
    </aside>

    <main class="auth-main">
      <div class="auth-card card">
      <!-- 登入 ------------------------------------------------------ -->
      <div id="login-panel">
        <div class="auth-mark"><span class="material-symbols-outlined">login</span></div>
        <h2 class="auth-title">歡迎回來</h2>
        <p class="auth-sub">請輸入您的帳號密碼以登入系統</p>

        <form id="login-form" class="auth-form" autocomplete="on">
          <div id="login-error" class="form-error hidden">
            <span class="material-symbols-outlined">error</span>
            <span data-role="text"></span>
          </div>

          <div class="field">
            <label class="field-label" for="login-account"><strong>電子郵件 / 帳號</strong></label>
            <div class="input-wrap">
              <span class="material-symbols-outlined">mail</span>
              <input id="login-account" name="account" type="text"
                     placeholder="name@company.com" autocomplete="username" required>
            </div>
          </div>

          <div class="field">
            <label class="field-label" for="login-password">
              <strong>密碼</strong>
              <a href="#" id="forgot-link">忘記密碼？</a>
            </label>
            <div class="input-wrap">
              <span class="material-symbols-outlined">lock</span>
              <input id="login-password" name="password" type="password"
                     placeholder="••••••••" autocomplete="current-password" required>
              <button type="button" class="icon-btn" data-toggle-password="login-password"
                      aria-label="顯示密碼">
                <span class="material-symbols-outlined">visibility_off</span>
              </button>
            </div>
          </div>

          <label class="checkbox">
            <input id="login-remember" type="checkbox">
            <span>保持登入狀態</span>
          </label>

          <button id="login-submit" type="submit" class="btn btn-primary btn-block">登入</button>
        </form>

        <div class="auth-divider">或</div>

        <!-- Google Identity Services 會把官方登入按鈕渲染進這裡 -->
        <div id="google-slot" class="google-slot"></div>

        <p class="auth-footer">
          還沒有帳號？ <a href="#" id="go-register">立即註冊</a>
        </p>
      </div>

      <!-- 註冊 ------------------------------------------------------ -->
      <div id="register-panel" class="hidden">
        <div class="auth-mark"><span class="material-symbols-outlined">person_add</span></div>
        <h2 class="auth-title">建立帳號</h2>
        <p class="auth-sub">填寫以下資料即可開始使用 PATS</p>

        <form id="register-form" class="auth-form" autocomplete="on">
          <div id="register-error" class="form-error hidden">
            <span class="material-symbols-outlined">error</span>
            <span data-role="text"></span>
          </div>

          <div class="field">
            <label class="field-label" for="register-name"><strong>顯示名稱</strong></label>
            <div class="input-wrap">
              <span class="material-symbols-outlined">badge</span>
              <input id="register-name" type="text" placeholder="王小明"
                     autocomplete="name" maxlength="40" required>
            </div>
          </div>

          <div class="field">
            <label class="field-label" for="register-email"><strong>電子郵件</strong></label>
            <div class="input-wrap">
              <span class="material-symbols-outlined">mail</span>
              <input id="register-email" type="email" placeholder="name@company.com"
                     autocomplete="email" required>
            </div>
          </div>

          <div class="field">
            <label class="field-label" for="register-password">
              <strong>密碼</strong>
              <span class="field-note">至少 8 個字元</span>
            </label>
            <div class="input-wrap">
              <span class="material-symbols-outlined">lock</span>
              <input id="register-password" type="password" placeholder="設定你的密碼"
                     autocomplete="new-password" required>
              <button type="button" class="icon-btn" data-toggle-password="register-password"
                      aria-label="顯示密碼">
                <span class="material-symbols-outlined">visibility_off</span>
              </button>
            </div>
          </div>

          <div class="field">
            <label class="field-label" for="register-confirm"><strong>確認密碼</strong></label>
            <div class="input-wrap">
              <span class="material-symbols-outlined">lock_reset</span>
              <input id="register-confirm" type="password" placeholder="再次輸入密碼"
                     autocomplete="new-password" required>
            </div>
          </div>

          <!-- 只有在後端設定了邀請碼時才會顯示 -->
          <div class="field hidden" id="invite-field">
            <label class="field-label" for="register-invite"><strong>邀請碼</strong></label>
            <div class="input-wrap">
              <span class="material-symbols-outlined">key</span>
              <input id="register-invite" type="text" placeholder="請向管理員索取">
            </div>
          </div>

          <button id="register-submit" type="submit" class="btn btn-primary btn-block">
            建立帳號
          </button>
        </form>

        <p class="auth-footer">
          已經有帳號了？ <a href="#" id="go-login">返回登入</a>
        </p>
      </div>
      </div>
    </main>
  </section>

  <!-- 主應用 --------------------------------------------------------- -->
  <div id="app" class="app hidden" data-mobile="list">
    <!-- 側邊導覽 -->
    <nav class="rail" aria-label="主要導覽">
      <div class="rail-identity">
        <div class="avatar avatar-lg" id="me-avatar" aria-hidden="true">P</div>
        <div class="meta">
          <div class="name" id="me-name">PATS</div>
          <div class="role">商務通訊</div>
          <div class="status">上線中</div>
        </div>
      </div>

      <div class="rail-nav">
        <button class="rail-link is-active" data-view="dm">
          <span class="material-symbols-outlined">chat</span>
          <span class="label">私訊</span>
          <span class="badge count hidden" data-count="dm">0</span>
        </button>
        <button class="rail-link" data-view="group">
          <span class="material-symbols-outlined">groups</span>
          <span class="label">群組討論</span>
          <span class="badge count hidden" data-count="group">0</span>
        </button>
        <button class="rail-link" data-view="archive">
          <span class="material-symbols-outlined">archive</span>
          <span class="label">封存</span>
        </button>
        <button class="rail-link" data-view="settings">
          <span class="material-symbols-outlined">settings</span>
          <span class="label">設定</span>
        </button>
      </div>

      <div class="rail-spacer"></div>

      <div class="rail-foot">
        <button class="rail-link" data-view="profile">
          <span class="material-symbols-outlined">person</span>
          <span class="label">個人資料</span>
        </button>
        <button class="rail-link is-danger" data-action="logout">
          <span class="material-symbols-outlined">logout</span>
          <span class="label">登出</span>
        </button>
      </div>
    </nav>

    <!-- 對話列表 -->
    <section class="list-pane" id="list-pane">
      <header class="pane-head">
        <h2 id="list-title">私人訊息</h2>
        <span class="hint" id="list-hint"></span>
        <div class="actions">
          <button class="icon-btn" id="list-compose" title="發起新對話">
            <span class="material-symbols-outlined">edit_square</span>
          </button>
          <button class="icon-btn" id="list-more" title="更多">
            <span class="material-symbols-outlined">more_vert</span>
          </button>
        </div>
      </header>

      <div class="pane-search">
        <div class="input-wrap">
          <span class="material-symbols-outlined">search</span>
          <input id="list-search" type="search" placeholder="搜尋訊息或聯絡人">
        </div>
      </div>

      <div class="conv-list scroll-y" id="conv-list"></div>
    </section>

    <!-- 對話內容 -->
    <section class="chat-pane" id="chat-pane"></section>

    <!-- 設定 -->
    <section class="settings-pane scroll-y hidden" id="settings-pane"></section>
  </div>

  <div id="modal-root"></div>
  <div id="menu-root"></div>
  <div class="toast-stack" id="toast-root"></div>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/core.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/chat.js"></script>
  <script src="assets/js/settings.js"></script>
  <script src="assets/js/main.js"></script>
</body>
</html>
